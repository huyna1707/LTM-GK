<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dự án Toán Vui</title>

    <!-- CSS tĩnh -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <!-- MÀN HÌNH KHỞI ĐỘNG -->
    <section id="start-screen" class="screen active">
        <h1>Toán Vui</h1>

        <div class="input-group">
            <label for="player-name">Nhập tên của bạn:</label>
            <input type="text" id="player-name" placeholder="Tên của bạn">
        </div>

        <div class="level-selection">
            <h3>Chọn mức độ:</h3>
            <div class="level-buttons">
                <!-- data-level phải là easy | medium | hard (JS sẽ chuyển sang UPPERCASE) -->
                <button type="button" class="level-btn" data-level="easy">Dễ</button>
                <button type="button" class="level-btn" data-level="medium">Vừa</button>
                <button type="button" class="level-btn" data-level="hard">Khó</button>
            </div>
        </div>

        <!-- Nút bắt đầu (được JS enable khi có tên + level) -->
        <button id="start-game" class="start-btn" disabled>Bắt đầu</button>
    </section>

    <!-- MÀN HÌNH CÂU HỎI -->
    <section id="quiz-screen" class="screen">
        <div class="quiz-header">
            <div class="progress">
                Câu <span id="question-number">1</span> / 10
            </div>
            <div class="timer">
                <span id="timer-display">30</span>s
            </div>
        </div>

        <div class="question-container">
            <h2 id="question-text">Câu hỏi sẽ hiển thị ở đây</h2>

            <div class="answers">
                <!-- data-answer: 0..3 -->
                <button type="button" class="answer-btn" data-answer="0">A</button>
                <button type="button" class="answer-btn" data-answer="1">B</button>
                <button type="button" class="answer-btn" data-answer="2">C</button>
                <button type="button" class="answer-btn" data-answer="3">D</button>
            </div>
        </div>
    </section>

    <!-- POPUP KẾT QUẢ -->
    <div id="result-popup" class="popup">
        <div class="popup-content">
            <h2 id="congratulations">Chúc mừng!</h2>
            <p id="score-display">Điểm số: 0/10</p>

            <div class="popup-buttons">
                <button id="finish-btn" class="popup-btn">Hoàn tất</button>
                <button id="new-level-btn" class="popup-btn">Chọn level khác</button>
            </div>
        </div>
    </div>
</div>

<!-- JS tĩnh -->
<script th:src="@{/js/style.js}"></script>
</body>
</html>
